<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Till Infinity Live IPTV Player</title>
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .circle {
            position: absolute;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.15;
        }
        .circle-1 { width: 400px; height: 400px; top: -10%; left: -10%; }
        .circle-2 { width: 500px; height: 500px; bottom: -10%; right: -10%; }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 850px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(to right, #38bdf8, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        p {
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .player-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.3);
            border: 2px solid rgba(99, 102, 241, 0.5);
            margin-bottom: 25px;
            background: #000;
            aspect-ratio: 16 / 9;
        }

        .video-js, iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
        }

        .select-box {
            position: relative;
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        select {
            width: 100%;
            padding: 14px 20px;
            font-size: 1rem;
            color: #fff;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            cursor: pointer;
            outline: none;
            appearance: none;
        }

        .select-box::after {
            content: '▼';
            font-size: 0.8rem;
            top: 18px;
            right: 20px;
            position: absolute;
            color: #94a3b8;
            pointer-events: none;
        }

        select option, select optgroup {
            background: #0f172a;
            color: #fff;
        }

        footer {
            margin-top: 20px;
            color: #64748b;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>

    <div class="container">
        <h1>📺 Till Infinity IPTV</h1>
        <p>নিচের ড্রপডাউন মেনু থেকে লাইভ চ্যানেল সিলেক্ট করুন</p>

        <div class="player-wrapper" id="player-container">
            <!-- Default Placeholder Player -->
            <video id="my-video" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto">
                <source src="https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8" type="application/x-mpegURL">
            </video>
        </div>

        <div class="select-box">
            <select id="channel-select" onchange="changeChannel()">
                <option value="" disabled selected>একটি চ্যানেল বেছে নিন...</option>
                
                <optgroup label="🔴 লাইভ নিউজ (স্থায়ী)">
                    <option value="youtube:https://www.youtube.com/embed/gCNeDWCI0vo?autoplay=1">Al Jazeera English (Live)</option>
                    <option value="youtube:https://www.youtube.com/embed/2mCSY3f8Sgk?autoplay=1">ABC News Live</option>
                    <option value="youtube:https://www.youtube.com/embed/9AuqEj535lg?autoplay=1">DW News Live</option>
                </optgroup>

                <optgroup label="🌍 গ্লোবাল ফ্রি স্ট্রিম (HLS)">
                    <option value="hls:https://bitdash-a.akamaihd.net/content/MI201109210084_1/m3u8s/f08e80da-bf1d-4e3d-8899-f0f6155f6efa.m3u8">HD Demo Movie</option>
                    <option value="hls:https://nhkworld.akamaized.net/hls/live/2023583/nhkworld/g_stream_1080.m3u8">NHK World (Japan)</option>
                </optgroup>
            </select>
        </div>

        <footer>&copy; 2026 Till Infinity. All Rights Reserved.</footer>
    </div>

    <script src="https://vjs.zencdn.net/8.3.0/video.js"></script>

    <script>
        var player = videojs('my-video');

        function changeChannel() {
            var select = document.getElementById("channel-select");
            var rawValue = select.value;
            var container = document.getElementById("player-container");

            if (!rawValue) return;

            var type = rawValue.split(':')[0];
            var url = rawValue.substring(type.length + 1);

            if (type === 'youtube') {
                // Destroy videojs instance if it exists to avoid conflict
                if (player) {
                    player.dispose();
                    player = null;
                }
                container.innerHTML = `<iframe src="${url}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
            } else if (type === 'hls') {
                container.innerHTML = `<video id="my-video" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto"></video>`;
                setTimeout(function() {
                    player = videojs('my-video');
                    player.src({
                        src: url,
                        type: 'application/x-mpegURL'
                    });
                    player.play();
                }, 50);
            }
        }
    </script>
</body>
</html>
