<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Till Infinity Play - Premium IPTV</title>
    
    <!-- Premium Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght=700&family=Plus+Jakarta+Sans:wght=400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Clappr Video Engine -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    
    <style>
        :root {
            --bg-base: #020617;
            --bg-surface: #0b1329;
            --accent: #ff2a5f;
            --accent-glow: rgba(255, 42, 95, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow-x: hidden;
            overflow-y: hidden;
        }

        /* PREMIUM 3D INTRO ANIMATION */
        #intro-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            perspective: 1200px;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .intro-title {
            font-family: 'Cinzel', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 0 1px 0 #bbb, 0 3px 0 #999, 0 0 20px var(--accent);
            animation: intro3DAndro 2.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            opacity: 0;
        }

        @keyframes intro3DAndro {
            0% { transform: translateZ(-600px) rotateX(60deg); opacity: 0; }
            100% { transform: translateZ(0px) rotateX(0deg); opacity: 1; }
        }

        /* HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 4%;
            background: rgba(2, 6, 23, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .brand-text {
            font-family: 'Cinzel', serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* RESPONSIVE 16:9 PLAYER */
        .hero-theater {
            margin-top: 55px;
            width: 100%;
            background: #000;
            position: relative;
            aspect-ratio: 16 / 9;
        }

        .video-box, #player-canvas {
            width: 100%;
            height: 100%;
            display: none;
        }

        .theater-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
        }

        .btn-close {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
        }

        /* DROPDOWN & GRID */
        .dashboard-container {
            padding: 20px 4%;
        }

        .filter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .custom-dropdown select {
            background: var(--bg-surface);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            outline: none;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .stream-card {
            background: var(--bg-surface);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .card-banner {
            width: 100%;
            aspect-ratio: 16 / 10;
            background: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .live-indicator {
            position: absolute;
            top: 6px;
            left: 6px;
            background: #ef4444;
            color: white;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 4px;
        }

        .card-meta {
            padding: 8px;
        }

        .card-headline {
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* LOADING STATUS */
        #status-log {
            text-align: center;
            color: var(--accent);
            font-size: 0.85rem;
            margin: 20px 0;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="intro-loader">
        <div class="intro-title">Till Infinity</div>
    </div>

    <header>
        <a href="#" class="brand-text">Till Infinity</a>
    </header>

    <section class="hero-theater">
        <div class="video-box" id="theater-shell">
            <button class="btn-close" onclick="shutdownStream()"><i class="fa-solid fa-xmark"></i> Close</button>
            <div id="player-canvas"></div>
        </div>
        <div class="theater-placeholder" id="idle-core">
            <h3>Cinema Engine</h3>
            <p style="font-size: 0.75rem; color: var(--text-muted);">চ্যানেল সিলেক্ট করুন, স্ট্রিম অটোমেটিক চালু হবে।</p>
        </div>
    </section>

    <main class="dashboard-container">
        <div class="filter-row">
            <h4 style="font-size: 0.95rem;">Live Playlists</h4>
            <div class="custom-dropdown">
                <!-- এখানে সিলেক্ট করলেই সেই প্লেলিস্ট পার্স হয়ে যাবে -->
                <select id="playlist-selector" onchange="loadM3UPlaylist(this.value)">
                    <option value="https://iptv-org.github.io/iptv/categories/animation.m3u">Animation</option>
                    <option value="https://iptv-org.github.io/iptv/categories/auto.m3u">Auto & Sports</option>
                    <option value="https://iptv-org.github.io/iptv/categories/comedy.m3u">Comedy</option>
                    <option value="https://iptv-org.github.io/iptv/categories/cooking.m3u">Cooking</option>
                </select>
            </div>
        </div>

        <div id="status-log">চ্যানেল লোড হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন।</div>
        <div class="media-grid" id="channel-container"></div>
    </main>

    <script>
        var clapprCore = null;

        // INTRO CONTROL
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('intro-loader').style.opacity = '0';
                document.getElementById('intro-loader').style.visibility = 'hidden';
                document.body.style.overflowY = 'auto';
                // ডিফল্ট প্রথম প্লেলিস্ট লোড হবে
                loadM3UPlaylist(document.getElementById('playlist-selector').value);
            }, 2500);
        });

        // DYNAMIC M3U PARSER ENGINE
        async function loadM3UPlaylist(m3uUrl) {
            const container = document.getElementById('channel-container');
            const statusLog = document.getElementById('status-log');
            container.innerHTML = "";
            statusLog.style.display = "block";
            statusLog.innerText = "প্লেলিস্ট প্রসেস করা হচ্ছে...";

            try {
                // CORS ব্লকিং এড়াতে পাবলিক প্রক্সি ব্যবহার করা হয়েছে
                const response = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(m3uUrl));
                if (!response.ok) throw new Error("Network issue");
                const m3uText = await response.text();

                const lines = m3uText.split('\n');
                let channels = [];
                let currentChannel = {};

                // M3U টেক্সট লাইন বাই লাইন রিড করার লুপ
                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (line.startsWith('#EXTINF:')) {
                        // চ্যানেলের নাম বের করা
                        let nameMatch = line.split(',');
                        currentChannel.name = nameMatch[nameMatch.length - 1] || "Unknown Channel";
                    } else if (line.startsWith('http')) {
                        // চ্যানেলের লাইভ লিঙ্ক সেট করা
                        currentChannel.url = line;
                        channels.push(currentChannel);
                        currentChannel = {};
                    }
                }

                statusLog.style.display = "none";

                // অ্যান্ড্রয়েড গ্রিডে সর্বোচ্চ ৬০টি চ্যানেল রেন্ডার করার লিমিট (যাতে ফোন ল্যাগ না করে)
                channels.slice(0, 60).forEach(ch => {
                    const card = document.createElement('div');
                    card.className = 'stream-card';
                    card.onclick = () => playLiveStream(ch.url);
                    card.innerHTML = `
                        <div class="card-banner"><div class="live-indicator">LIVE</div><i class="fa-solid fa-tv" style="color: rgba(255,255,255,0.2)"></i></div>
                        <div class="card-meta">
                            <div class="card-headline">${ch.name}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                statusLog.innerText = "প্লেলিস্ট লোড ব্যর্থ হয়েছে! আবার চেষ্টা করুন।";
            }
        }

        // PLAYER CONTROL
        function playLiveStream(url) {
            document.getElementById('idle-core').style.display = 'none';
            document.getElementById('theater-shell').style.display = 'block';

            if (clapprCore) { clapprCore.destroy(); }

            clapprCore = new Clappr.Player({
                source: url,
                parentId: "#player-canvas",
                autoPlay: true,
                width: '100%',
                height: '100%'
            });
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function shutdownStream() {
            if (clapprCore) { clapprCore.destroy(); clapprCore = null; }
            document.getElementById('theater-shell').style.display = 'none';
            document.getElementById('idle-core').style.display = 'block';
        }
    </script>
</body>
</html>
